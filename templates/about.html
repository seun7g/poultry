{% extends 'base.html' %}

{% block title %}About Us - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h1 class="display-4 mb-4 border-bottom pb-2">About Our Poultry</h1>
            {% for about in about_us %}
                <div class="mb-5">
                    <h2 class="h3 text-primary">{{ about.title }}</h2>
                    <div class="lead">
                        {{ about.description|linebreaks }}
                    </div>
                </div>
            {% empty %}
                <p class="lead">Information about us is coming soon!</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
